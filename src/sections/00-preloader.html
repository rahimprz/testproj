<div class="preloader" data-preloader aria-hidden="true">
  <div class="preloader__cols">
    <span class="preloader__col"></span><span class="preloader__col"></span><span class="preloader__col"></span><span class="preloader__col"></span><span class="preloader__col"></span>
  </div>
  <div class="preloader__glow"></div>
  <div class="preloader__inner">
    <div class="preloader__top">
      <span class="preloader__mask"><span class="preloader__brand">Orchid<sup>®</sup></span></span>
      <span class="preloader__mask"><span class="preloader__note">Brand&nbsp;·&nbsp;Web&nbsp;·&nbsp;Story</span></span>
      <span class="preloader__mask preloader__mask--right"><span class="preloader__note">Est. 2014 — Independent studio</span></span>
    </div>
    <div class="preloader__mark">
      <svg class="preloader__svg" viewBox="0 0 100 100" fill="none">
        <defs>
          <linearGradient id="pl-grad" x1="20" y1="10" x2="80" y2="90" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#f2c4d6"/>
            <stop offset="0.5" stop-color="#b26bd8"/>
            <stop offset="1" stop-color="#5b2378"/>
          </linearGradient>
        </defs>
        <g class="preloader__petals" stroke="#f4efe8" stroke-width="0.6" fill="url(#pl-grad)" fill-opacity="0">
          <path class="preloader__petal" d="M50 50 C 41 38, 40 19, 50 6 C 60 19, 59 38, 50 50 Z"/>
          <path class="preloader__petal" d="M50 50 C 41 38, 40 19, 50 6 C 60 19, 59 38, 50 50 Z" transform="rotate(72 50 50)"/>
          <path class="preloader__petal" d="M50 50 C 41 38, 40 19, 50 6 C 60 19, 59 38, 50 50 Z" transform="rotate(144 50 50)"/>
          <path class="preloader__petal" d="M50 50 C 41 38, 40 19, 50 6 C 60 19, 59 38, 50 50 Z" transform="rotate(216 50 50)"/>
          <path class="preloader__petal" d="M50 50 C 41 38, 40 19, 50 6 C 60 19, 59 38, 50 50 Z" transform="rotate(288 50 50)"/>
        </g>
        <circle class="preloader__core" cx="50" cy="50" r="3.2" fill="#e8c46a"/>
      </svg>
    </div>
    <div class="preloader__bottom">
      <div class="preloader__count">
        <span class="preloader__digit"><span>0</span></span><span class="preloader__digit"><span>0</span></span><span class="preloader__digit"><span>0</span></span>
      </div>
      <p class="preloader__tag">
        <span class="preloader__mask"><span>Cultivating</span></span>
        <span class="preloader__mask"><span>something</span></span>
        <span class="preloader__mask"><em>beautiful</em></span>
      </p>
    </div>
    <div class="preloader__bar"><span></span></div>
  </div>
</div>
