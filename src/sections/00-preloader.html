<div class="preloader" data-preloader aria-hidden="true">
  <div class="preloader__cols">
    <span class="preloader__col"></span><span class="preloader__col"></span><span class="preloader__col"></span><span class="preloader__col"></span><span class="preloader__col"></span>
  </div>
  <div class="preloader__glow"></div>
  <div class="preloader__inner">
    <div class="preloader__top">
      <span class="preloader__mask"><span class="preloader__brand">William W. Halford</span></span>
      <span class="preloader__mask"><span class="preloader__note">Science&nbsp;fiction</span></span>
      <span class="preloader__mask preloader__mask--right"><span class="preloader__note">Earth&nbsp;→&nbsp;Borland</span></span>
    </div>
    <div class="preloader__mark">
      <svg class="preloader__svg" viewBox="0 0 100 100" fill="none">
        <defs>
          <radialGradient id="pl-sun" cx="40%" cy="38%" r="65%">
            <stop offset="0" stop-color="#ffe2a8"/>
            <stop offset="0.45" stop-color="#eeb253"/>
            <stop offset="1" stop-color="#ed970f"/>
          </radialGradient>
        </defs>
        <g class="preloader__petals" stroke="#ffffff" stroke-opacity="0.55" stroke-width="0.5">
          <ellipse class="preloader__petal" cx="50" cy="50" rx="44" ry="16" transform="rotate(-18 50 50)"/>
          <ellipse class="preloader__petal" cx="50" cy="50" rx="36" ry="30" transform="rotate(24 50 50)"/>
          <circle class="preloader__petal" cx="50" cy="50" r="47"/>
        </g>
        <circle class="preloader__core" cx="50" cy="50" r="13" fill="url(#pl-sun)"/>
        <circle class="preloader__moon" cx="80" cy="33" r="5" fill="#eeb253"/>
      </svg>
    </div>
    <div class="preloader__bottom">
      <div class="preloader__count">
        <span class="preloader__digit"><span>0</span></span><span class="preloader__digit"><span>0</span></span><span class="preloader__digit"><span>0</span></span>
      </div>
      <p class="preloader__tag">
        <span class="preloader__mask"><span>POR!</span></span>
        <span class="preloader__mask"><span>Prince&nbsp;of</span></span>
        <span class="preloader__mask"><span class="preloader__accent">Borland</span></span>
      </p>
    </div>
    <div class="preloader__bar"><span></span></div>
  </div>
</div>
