<section class="section contact" id="cont" data-section="contact" data-theme="light">
  <div class="container contact__grid">
    <div class="contact__media">
      <div class="contact__shape" aria-hidden="true"></div>
      <figure class="contact__img" data-media>
        <img src="assets/img/original/book-mockups-1.png" data-remote="https://orchid-tapir-982695.hostingersite.com/wp-content/uploads/2026/04/book-mockups-1-1024x997.png" alt="POR! Prince of Borland, book mockup" width="1024" height="997" loading="lazy">
        <div class="book3d" aria-hidden="true"><div class="book3d__body"><div class="book3d__cover"><span></span><span class="book3d__por">POR!</span><span class="book3d__title">Prince of Borland</span><span class="book3d__author">William W. Halford</span></div><div class="book3d__pages"></div></div></div>
      </figure>
    </div>
    <div class="contact__copy">
      <h2 class="contact__title" data-split="words">Connect With the <span class="hl">Author</span></h2>
      <!-- Posts to the WordPress site's Contact Form 7 form (id 98) without JavaScript. -->
      <form class="contact__form" action="https://orchid-tapir-982695.hostingersite.com/#wpcf7-f98-p12-o1" method="post" data-reveal-group="up" data-stagger="0.07">
        <input type="hidden" name="_wpcf7" value="98">
        <input type="hidden" name="_wpcf7_version" value="6.1.5">
        <input type="hidden" name="_wpcf7_locale" value="en_US">
        <input type="hidden" name="_wpcf7_unit_tag" value="wpcf7-f98-p12-o1">
        <input type="hidden" name="_wpcf7_container_post" value="12">
        <input type="hidden" name="_wpcf7_posted_data_hash" value="">
        <div class="field"><input id="cf-first" name="FirstName" type="text" required maxlength="400" autocomplete="given-name" placeholder=" "><label for="cf-first">First Name</label></div>
        <div class="field"><input id="cf-last" name="LastName" type="text" required maxlength="400" autocomplete="family-name" placeholder=" "><label for="cf-last">Last Name</label></div>
        <div class="field"><input id="cf-email" name="Email" type="email" required maxlength="400" autocomplete="email" placeholder=" "><label for="cf-email">Email Address</label></div>
        <div class="field"><input id="cf-phone" name="PhoneNumber" type="tel" required maxlength="400" autocomplete="tel" placeholder=" "><label for="cf-phone">Phone Number</label></div>
        <div class="field field--full"><textarea id="cf-msg" name="YourMessage" rows="5" maxlength="2000" placeholder=" "></textarea><label for="cf-msg">Your Message</label></div>
        <div class="field--full">
          <button class="btn btn--lg btn--dark" type="submit" data-magnetic="0.2">
            <span class="btn__label"><span class="btn__label-inner" data-text="Submit">Submit</span></span>
            <span class="btn__icon" aria-hidden="true">→</span>
          </button>
        </div>
      </form>
    </div>
  </div>
</section>
